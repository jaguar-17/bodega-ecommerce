# NOMBRE DE LA APLICACIÓN Y PUERTO DEL SERVIDOR
spring.application.name=bodega-backend
server.port=8080

# CONFIGURACIÓN DE LA BASE DE DATOS
spring.datasource.url=jdbc:mariadb://localhost:3306/bodega_db?createDatabaseIfNotExist=true
spring.datasource.username=${MARIA_DB_USER}
spring.datasource.password=${MARIA_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
