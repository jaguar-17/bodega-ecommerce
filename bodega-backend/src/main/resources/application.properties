# NOMBRE DE LA APLICACION Y PUERTO DEL SERVIDOR
spring.application.name=bodega-backend
server.port=8080

# CONFIGURACION DE LA BASE DE DATOS
spring.datasource.url=jdbc:mariadb://localhost:3306/bodega_db?createDatabaseIfNotExist=true
spring.datasource.username=${MARIA_DB_USER}
spring.datasource.password=${MARIA_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# CONFIGURACION DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# CONFIGURACION DE JWT
jwt.secret=${JWT_SECRET_KEY}
jwt.expirationMs=86400000

# CONFIGURACION DE CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# LIMITE DE TAMAÑO DE ARCHIVOS SUBIDOS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CONFIGURACION OAUTH2 GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile