<header class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="container mx-auto px-4 h-16 flex items-center justify-between">

    <a routerLink="/" class="text-2xl font-black text-blue-600 tracking-tighter">
      MiBodega<span class="text-yellow-500">.</span>
    </a>

    <div class="flex items-center gap-4">
      <a routerLink="/cart" class="relative p-2 text-gray-600 hover:text-blue-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/>
        </svg>
        @if (cartService.totalItems() > 0) {
          <span
            class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-sm">
          {{ cartService.totalItems() }}
        </span>
        }
      </a>
      @if (isAuthenticated()) {
        <span class="text-sm text-gray-600 hidden md:inline">Hola, Cliente</span>
        <button (click)="logout()" class="text-sm font-medium text-red-500 hover:text-red-700">
          Salir
        </button>
      } @else {
        <a routerLink="/auth/login" class="text-sm font-medium text-gray-600 hover:text-blue-600">
          Iniciar Sesión
        </a>
        <a routerLink="/auth/register"
           class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-blue-700 transition">
          Registrarse
        </a>
      }
    </div>

  </div>
</header>

<main class="bg-gray-50 min-h-screen">
  <router-outlet></router-outlet>
</main>
