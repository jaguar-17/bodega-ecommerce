<div class="container mx-auto px-4 py-8 max-w-4xl">
  <h1 class="text-3xl font-bold text-gray-800 mb-8">Tu Carrito de Compras</h1>

  @if (items().length === 0) {
    <div class="text-center py-12 bg-white rounded-xl shadow-sm">
      <p class="text-gray-500 text-lg mb-4">Tu carrito está vacío 😢</p>
      <a routerLink="/" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-full hover:bg-blue-700 transition">
        Ir a comprar
      </a>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

      <div class="md:col-span-2 space-y-4">
        @for (item of items(); track item.product.id) {
          <div class="flex items-center gap-4 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
            <img [src]="item.product.imageUrl" class="w-20 h-20 object-cover rounded-md bg-gray-100" alt="">

            <div class="flex-grow">
              <h3 class="font-semibold text-gray-800">{{ item.product.name }}</h3>
              <p class="text-blue-600 font-bold">{{ item.product.price | currency }}</p>
            </div>

            <div class="flex items-center gap-3">
              <button (click)="decrease(item.product.id, item.quantity)"
                      class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-600">
                -
              </button>
              <span class="w-4 text-center font-medium">{{ item.quantity }}</span>
              <button (click)="increase(item.product.id, item.quantity)"
                      class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-600">
                +
              </button>
            </div>

            <button (click)="remove(item.product.id)" class="text-red-400 hover:text-red-600 p-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                   stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
              </svg>
            </button>
          </div>
        }
      </div>

      <div class="h-fit bg-white p-6 rounded-xl shadow-md border border-gray-100 sticky top-20">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Resumen</h3>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Método de Entrega</label>
          <select
            [(ngModel)]="selectedDeliveryMethod"
            class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"
          >
            <option value="PICKUP">Recojo en Tienda (Gratis)</option>
            <option value="DELIVERY">Delivery a Domicilio</option>
          </select>
        </div>
        <div class="border-t pt-4 flex justify-between text-2xl font-bold text-gray-900 mb-6">
          <span>Total</span>
          <span>{{ totalPrice() | currency }}</span>
        </div>

        <button
          (click)="checkout()"
          [disabled]="isProcessingOrder || items().length === 0"
          class="w-full bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center"
        >
          @if (isProcessingOrder) {
            <div class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-2"></div>
            Procesando...
          } @else {
            Confirmar Pedido
          }
        </button>
      </div>

    </div>
  }
</div>
