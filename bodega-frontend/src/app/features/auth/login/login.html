<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 space-y-6 border border-gray-200">

    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-gray-900">Bienvenido 👋</h2>
      <p class="mt-2 text-sm text-gray-600">Ingresa a tu cuenta para hacer pedidos</p>
    </div>

    @if (errorMessage) {
      <div class="bg-red-50 text-red-600 p-3 rounded text-sm text-center border border-red-200">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <div class="mt-1">
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            placeholder="ejemplo@correo.com"
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <div class="mt-1">
          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            placeholder="••••••••"
          >
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        Ingresar
      </button>
    </form>

    <div class="text-center text-sm">
      <span class="text-gray-500">¿No tienes cuenta?</span>
      <a routerLink="/auth/register" class="font-medium text-blue-600 hover:text-blue-500 ml-1">Regístrate aquí</a>
    </div>

  </div>
</div>
